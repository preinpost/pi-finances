# pi 금융분석 에이전트 — compose 예제 (템플릿)
#
# 사용법:
#   cp compose.example.yaml compose.yaml   # 복사 후 compose.yaml에 실제 키 입력
#   docker compose up --build
#   브라우저 → http://localhost:7681  (user=pi, token=$TTYD_TOKEN 또는 시작 로그)
#
# ⚠️ 실제 키는 compose.yaml에만 입력 — 이 파일은 템플릿이므로 그대로 커밋 유지.
#    compose.yaml은 .gitignore 대상이며 .dockerignore로 빌드 컨텍스트에서 제외된다.
services:
  pi-finance:
    build: .
    image: pi-finance:latest
    init: true               # PID 1 = tini — 시그널/좀비 처리
    restart: unless-stopped
    ports:
      - "7681:7681"          # 웹터미널
    environment:
      # ── LLM 프로바이더 (원하는 프로바이더 블록을 주석 해제해 한 세트로 사용) ──
      # 모델 ID 확인: 컨테이너 안에서 pi --list-models (또는 TUI /model 로 변경 가능)
      #
      # [Anthropic — 기본값]
      ANTHROPIC_API_KEY: ""
      # PI_DEFAULT_MODEL: "anthropic/claude-sonnet-4"
      # PI_DEFAULT_THINKING: "medium"
      #
      # [OpenRouter — 여러 모델을 하나의 키로 라우팅]
      # OPENROUTER_API_KEY: ""
      # PI_DEFAULT_MODEL: "openrouter/deepseek/deepseek-chat"
      # PI_DEFAULT_THINKING: "low"
      #
      # [DeepSeek — 저렴한 분석용]
      # DEEPSEEK_API_KEY: ""
      # PI_DEFAULT_MODEL: "deepseek/deepseek-v4-pro"
      # PI_DEFAULT_THINKING: "high"
      #
      # [OpenAI — GPT 시리즈]
      # OPENAI_API_KEY: ""
      # PI_DEFAULT_MODEL: "openai/gpt-5.6"
      # PI_DEFAULT_THINKING: "medium"
      #
      # [Google Gemini]
      # GEMINI_API_KEY: ""
      # PI_DEFAULT_MODEL: "google/gemini-3.6-flash"
      #
      # [xAI (Grok)]
      # XAI_API_KEY: ""
      # PI_DEFAULT_MODEL: "xai/grok-4.3"
      #
      # [Groq — 빠른 추론 (Llama 등 오픈모델)]
      # GROQ_API_KEY: ""
      # PI_DEFAULT_MODEL: "groq/llama-3.3-70b"
      #
      # [Mistral]
      # MISTRAL_API_KEY: ""
      # PI_DEFAULT_MODEL: "mistral/mistral-large-latest"
      # ── 한국투자증권 OPEN API (선택 — https://apiportal.koreainvestment.com) ──
      KIS_APP_KEY: ""          # 실전투자 App Key
      KIS_APP_SECRET: ""       # 실전투자 App Secret
      # KIS_PAPER_APP_KEY: ""     # 모의투자 App Key (선택)
      # KIS_PAPER_APP_SECRET: ""  # 모의투자 App Secret (선택)
      # ── 토스증권 OPEN API (선택) ───────────────────────────────────────
      TOSS_CLIENT_ID: ""
      TOSS_CLIENT_SECRET: ""
      # ── 무료 시장 데이터 (선택) ────────────────────────────────────────
      TWELVE_API_KEY: ""     # https://twelvedata.com   전 세계 시세·차트·환율
      FINNHUB_API_KEY: ""    # https://finnhub.io       미국 주식·뉴스·펀더멘털
      COINGECKO_API_KEY: ""  # https://www.coingecko.com 암호화폐
      # ── 네이버 검색 API (선택 — NAVER API HUB, 한국 증권 뉴스) ─────────
      NAVER_CLIENT_ID: ""
      NAVER_CLIENT_SECRET: ""
      # NCP API Gateway를 쓴다면 mode=hub + 아래 2개 (선택)
      # NAVER_NEWS_API_MODE: "hub"
      # NCP_APIGW_API_KEY_ID: ""
      # NCP_APIGW_API_KEY: ""
      # ── 웹터미널 basic-auth 토큰 (선택) ────────────────────────────────
      # 미설정 시 컨테이너 시작마다 자동 생성되어 시작 로그에 출력된다.
      TTYD_TOKEN: ""
    # ── 선택: 세션·리포트만 보존 (키 파일은 절대 볼륨에 두지 않음 — 설계 §8.6) ──
    # volumes:
    #   - pi-finance-sessions:/opt/pi-agent/sessions
    #   - ./reports:/workspace/reports

# volumes:
#   pi-finance-sessions:
