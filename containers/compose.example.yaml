# pi 금융분석 에이전트 — compose 예제 (템플릿)
#
# 사용법:
#   cp compose.example.yaml compose.yaml   # 복사 후 compose.yaml에 실제 키 입력
#   docker compose up --build
#   브라우저 → http://localhost:8080  (user=$PI_WEB_USER, password=$PI_WEB_PASSWORD)
#
# ⚠️ 실제 키는 compose.yaml에만 입력 — 이 파일은 템플릿이므로 그대로 커밋 유지.
#    compose.yaml은 .gitignore 대상이며 .dockerignore로 빌드 컨텍스트에서 제외된다.
services:
  pi-finance:
    build: .
    image: ghcr.io/preinpost/pi-finance:latest
    pull_policy: always
    init: true               # PID 1 = tini — 시그널/좀비 처리
    restart: unless-stopped
    ports:
      - "8080:8080"          # 웹챗
    environment:
      # ── 웹챗 비밀번호 게이트 (PASSWORD 미설정 시 시작 로그에 자동 생성) ──
      PI_WEB_USER: "pi"
      # PI_WEB_PASSWORD: "change-me"
      # PI_WEB_AUTH: "0"      # 로컬 전용 — 인증 끄기 (외부 노출 금지)
      # PI_DISABLE_MODEL_SELECTION: "true"  # true면 헤더의 모델/thinking 선택 메뉴 숨김 (env 전용, 사용자가 UI에서 해제 불가)

      # ── LLM 프로바이더 (원하는 프로바이더 블록을 주석 해제해 한 세트로 사용) ──
      # 모델 ID 확인: 컨테이너 안에서 pi --list-models (또는 TUI /model 로 변경 가능)
      #
      # [Anthropic — 기본값]
      ANTHROPIC_API_KEY: ""
      # PI_DEFAULT_MODEL: "anthropic/claude-sonnet-4"
      # PI_DEFAULT_THINKING: "medium"
      #
      # [OpenRouter — 여러 모델을 하나의 키로 라우팅]
      # OPENROUTER_API_KEY: ""
      # PI_DEFAULT_MODEL: "openrouter/deepseek/deepseek-chat"
      # PI_DEFAULT_THINKING: "low"
      #
      # [DeepSeek — 저렴한 분석용]
      # DEEPSEEK_API_KEY: ""
      # PI_DEFAULT_MODEL: "deepseek/deepseek-v4-pro"
      # PI_DEFAULT_THINKING: "high"
      #
      # [OpenAI — GPT 시리즈]
      # OPENAI_API_KEY: ""
      # PI_DEFAULT_MODEL: "openai/gpt-5.6"
      # PI_DEFAULT_THINKING: "medium"
      #
      # [Google Gemini]
      # GEMINI_API_KEY: ""
      # PI_DEFAULT_MODEL: "google/gemini-3.6-flash"
      #
      # [xAI (Grok)]
      # XAI_API_KEY: ""
      # PI_DEFAULT_MODEL: "xai/grok-4.3"
      #
      # [Groq — 빠른 추론 (Llama 등 오픈모델)]
      # GROQ_API_KEY: ""
      # PI_DEFAULT_MODEL: "groq/llama-3.3-70b"
      #
      # [Mistral]
      # MISTRAL_API_KEY: ""
      # PI_DEFAULT_MODEL: "mistral/mistral-large-latest"
      # ── 한국투자증권 OPEN API (선택 — https://apiportal.koreainvestment.com) ──
      KIS_APP_KEY: ""          # 실전투자 App Key
      KIS_APP_SECRET: ""       # 실전투자 App Secret
      # ⚠️ 조회 가능 범위는 API 신청 계좌의 거래가능시장에 따라 달라집니다.
      #    해외주식 시세·주문 API는 해외증권 거래신청이 된 계좌 + 한투 홈페이지의
      #    '해외주식 API 사용 동의'가 있어야 호출됩니다 — 없으면 국내 API는 되는데
      #    해외 API만 권한 오류가 납니다 (국내 전용 계좌면 해외주식 조회 불가).
      #    선물옵션은 더 엄격 — 전용 계좌 개설 필수: 국내선물옵션(상품코드 03),
      #    해외선물옵션(08). 종합계좌(01)로는 파생 API를 쓸 수 없습니다.
      KIS_ACCT_STOCK: ""       # 실전투자 계좌번호 (8자리+2자리, 예: 12345678-01)
      # KIS_PAPER_APP_KEY: ""     # 모의투자 App Key (선택)
      # KIS_PAPER_APP_SECRET: ""  # 모의투자 App Secret (선택)
      # KIS_PAPER_STOCK: ""       # 모의투자 계좌번호 (선택, 거래가능시장 규칙은 실전과 동일)
      # ── 토스증권 OPEN API (선택) ───────────────────────────────────────
      TOSS_CLIENT_ID: ""
      TOSS_CLIENT_SECRET: ""
      # ── 무료 시장 데이터 (선택) ────────────────────────────────────────
      TWELVE_API_KEY: ""     # https://twelvedata.com   전 세계 시세·차트·환율
      FINNHUB_API_KEY: ""    # https://finnhub.io       미국 주식·뉴스·펀더멘털
      COINGECKO_API_KEY: ""  # https://www.coingecko.com 암호화폐
      # ── Binance (선택 — 현물 Spot + USDT-M 선물) ──────────────────
      # https://www.binance.com → API Management 에서 HMAC 키 발급
      # 권한: Enable Reading + Enable Spot + Enable Futures
      # ⚠️ Enable Withdrawals 는 반드시 OFF. IP 제한 권장.
      # BINANCE_ENV: live (실전) | testnet
      #   현물 테스트넷 https://testnet.binance.vision
      #   선물 테스트넷 https://testnet.binancefuture.com  — 키가 서로 다름
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      BINANCE_ENV: "live"
      # ── 네이버 뉴스 (선택 — NAVER API HUB, 한국 증권 뉴스) ──────────
      # 신규 키(기본): mode=hub + NCP_APIGW_API_KEY_ID/KEY (console.ncloud.com/naver-api-hub)
      NAVER_NEWS_API_MODE: "hub"
      NCP_APIGW_API_KEY_ID: ""
      NCP_APIGW_API_KEY: ""
      # 구 개발자센터 키(2026-07-31 이전 발급, 2027-06-30까지)면:
      # NAVER_NEWS_API_MODE: "legacy" + NAVER_CLIENT_ID/NAVER_CLIENT_SECRET
    # ── 선택: 세션·리포트만 보존 (키 파일은 절대 볼륨에 두지 않음 — 설계 §8.6) ──
    # volumes:
    #   - pi-finance-sessions:/opt/pi-agent/sessions
    #   - ./reports:/workspace/reports

# volumes:
#   pi-finance-sessions:
