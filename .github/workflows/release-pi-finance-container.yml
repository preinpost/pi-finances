# Release pi-finance container — Docker 이미지 GHCR 릴리스
#
# 빌드 컨텍스트는 containers/ (Dockerfile이 web/, agent-config/, docker-entrypoint.sh를
# 상대 경로로 참조 — containers/compose.yaml의 build: . 과 동일).
#
# 트리거:
#   - main 푸시            → ghcr.io/preinpost/pi-finance:latest 갱신 (컨테이너 CI)
#   - v* 태그 푸시          → 버전 태그(1.2.3, 1.2) + latest 푸시 + GitHub Release 생성
#   - workflow_dispatch    → 수동 빌드/푸시 (tag 입력 시 해당 태그로, 없으면 sha-<short>)
#
# GITHUB_TOKEN(packages: write)으로 GHCR 인증 — 별도 시크릿 불필요.
# 멀티아키텍처: linux/amd64 + linux/arm64 (Dockerfile이 uname -m으로 ttyd 바이너리 분기).
# GHA 캐시로 재빌드 가속 (web-build npm ci + pi install 레이어).

name: Release pi-finance container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '이미지 버전 태그 (예: 1.2.3 — 미입력 시 sha-<short>)'
        required: false

permissions:
  contents: write   # GitHub Release 생성
  packages: write   # GHCR 푸시

concurrency:
  group: release-pi-finance-container
  cancel-in-progress: false

jobs:
  docker:
    name: Build & Push ghcr.io/preinpost/pi-finance
    runs-on: ubuntu-latest
    # npm 패키지 릴리스 워크플로우의 버전 커밋("[skip ci]")에 의한 재빌드 방지
    if: "!contains(github.event.head_commit.message || '', '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3 # arm64 레이어 빌드용

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 태그 규칙:
      #   v1.2.3 태그  → 1.2.3, 1.2, latest
      #   main 푸시    → latest
      #   dispatch     → 입력 tag (또는 sha-<short>)
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/preinpost/pi-finance
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,enable=${{ github.ref_type != 'tag' && inputs.tag == '' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: containers
          file: containers/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # v* 태그 푸시 시 GitHub Release 생성 (기존 패키지 릴리스 패턴과 동일)
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release create "${VERSION}" --generate-notes
          BODY=$(gh release view "${VERSION}" --json body -q .body)
          # heredoc(따옴표 없음) — ${VERSION#v}/${DIGEST}는 확장, \` 는 리터럴 백틱
          gh release edit "${VERSION}" --notes "$(cat <<EOF
${BODY}

---
### Docker 이미지
- \`ghcr.io/preinpost/pi-finance:${VERSION#v}\` (\`latest\`)
- digest: \`${DIGEST}\`
EOF
)"
          echo "Released ${VERSION}"
