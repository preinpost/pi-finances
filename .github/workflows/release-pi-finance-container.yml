# Release pi-finance container — Docker 이미지 GHCR 릴리스
#
# 버전 정책 (자동):
#   - 컨테이너 이미지 버전의 단일 소스 = containers/VERSION 파일
#   - npm 패키지 릴리스가 성공하면 workflow_run 후속 이벤트로 이 워크플로우가
#     트리거되어 containers/VERSION의 patch를 +1 커밋([skip ci]) → 버전 태그
#     (1.2.3, 1.2) + latest 빌드·푸시 → git 태그 v1.2.3 + GitHub Release 자동 생성.
#     패키지 워크플로우는 수정 불필요 (후속 빌드 트리거).
#   - [skip ci] 커밋은 GHA가 런 자체를 만들지 않으므로 이중 발화 없음.
#   - VERSION 변경 없는 main 푸시 → latest만 갱신 (컨테이너 CI)
#   - v* 태그 수동 푸시 / workflow_dispatch → 수동 릴리스 경로 유지
#     (자동 릴리스가 만든 태그의 재트리거는 릴리스 존재 확인 후 빌드 스킵)
#
# 빌드 컨텍스트는 containers/ (Dockerfile이 web/, agent-config/, docker-entrypoint.sh를
# 상대 경로로 참조 — containers/compose.yaml의 build: . 과 동일).
# GITHUB_TOKEN(packages: write)으로 GHCR 인증 — 별도 시크릿 불필요.
# 멀티아키텍처: linux/amd64 + linux/arm64 (Dockerfile이 uname -m으로 ttyd 바이너리 분기).
# GHA 캐시로 재빌드 가속 (web-build npm ci + pi install 레이어).

name: Release pi-finance container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '이미지 버전 태그 (예: 1.2.3 — 미입력 시 sha-<short>)'
        required: false
  # 후속 빌드 트리거 — npm 패키지 릴리스 완료(성공) 시 containers/VERSION patch+1 후 버전 릴리스
  workflow_run:
    workflows:
      - Release pi-coingecko
      - Release pi-finance-core
      - Release pi-finnhub
      - Release pi-kis
      - Release pi-naver-news
      - Release pi-toss
      - Release pi-twelve-data
    types: [completed]

permissions:
  contents: write   # 태그/릴리스 생성
  packages: write   # GHCR 푸시

concurrency:
  group: release-pi-finance-container
  cancel-in-progress: false

jobs:
  docker:
    name: Build & Push ghcr.io/preinpost/pi-finance
    runs-on: ubuntu-latest
    # npm 패키지 릴리스 워크플로우의 버전 커밋("[skip ci]")에 의한 재빌드 방지
    if: "!contains(github.event.head_commit.message || '', '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Detect new version이 git 태그(v*) 존재로 판정하므로 전체 히스토리 필요

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3 # arm64 레이어 빌드용

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 후속 트리거(workflow_run): npm 패키지 릴리스 성공 → containers/VERSION patch+1
      # 커밋([skip ci]) — GHA가 [skip ci] 커밋의 런을 만들지 않아 이중 발화 없음.
      # 릴리스 실패는 conclusion 필터, 스킵 커밋은 display_title 필터로 제외.
      - name: Bump container version (component release)
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          [ "${{ github.event.workflow_run.conclusion }}" = "success" ] || { echo "릴리스 실패(skip) — conclusion=${{ github.event.workflow_run.conclusion }}"; exit 0; }
          case "${{ github.event.workflow_run.display_title }}" in *"[skip ci]") echo "스킵 커밋 — 진행 안 함"; exit 0;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 병렬 릴리스(타 패키지) 직렬화: fetch 후 reset으로 항상 최신 상태에서 재계산
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if [ -f containers/VERSION ]; then
              IFS=. read -r MAJ MIN PATCH < containers/VERSION
              NEW="${MAJ}.${MIN}.$((PATCH + 1))"
            else
              NEW="1.0.0"
            fi
            echo "$NEW" > containers/VERSION
            git add containers/VERSION
            git commit -m "chore(container): v${NEW} [skip ci]" || true
            if git push origin HEAD:main; then
              echo "컨테이너 버전 → v${NEW}"
              exit 0
            fi
            sleep 8
          done
          echo "컨테이너 버전 범프 푸시 실패 (5회 재시도)" >&2
          exit 1

      - name: Read container version
        id: ver
        run: |
          if [ -f containers/VERSION ]; then
            echo "version=$(cat containers/VERSION)" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      # 자동 릴리스가 만든 v* 태그의 재트리거 감지 — 이미 릴리스가 있으면 빌드 스킵
      - name: Check release exists
        id: rel
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json id >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # VERSION 파일이 아직 릴리스되지 않은 새 버전인지 (git 태그 v* 존재 여부)
      - name: Detect new version
        id: newver
        if: github.ref_type == 'branch' && steps.ver.outputs.version != ''
        run: |
          if git tag -l "v${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "isnew=false" >> "$GITHUB_OUTPUT"
          else
            echo "isnew=true" >> "$GITHUB_OUTPUT"
          fi

      # 태그 규칙:
      #   v1.2.3 태그(수동)  → 1.2.3, 1.2, latest   (릴리스 없는 경우만 빌드)
      #   dispatch tag 입력   → 해당 태그만
      #   main + 새 VERSION  → 1.2.3, 1.2, latest
      #   main (기존 버전)    → latest
      #   dispatch (tag 없음) → sha-<short>
      - name: Compute image tags
        id: tags
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            TAGS="$(printf 'type=raw,value=%s\ntype=raw,value=%s\ntype=raw,value=latest\n' "$V" "${V%.*}")"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAGS="type=raw,value=${{ inputs.tag }}"
          elif [ "${{ steps.newver.outputs.isnew }}" = "true" ]; then
            V="${{ steps.ver.outputs.version }}"
            TAGS="$(printf 'type=raw,value=%s\ntype=raw,value=%s\ntype=raw,value=latest\n' "$V" "${V%.*}")"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="type=raw,value=latest"
          else
            TAGS="type=raw,value=sha-${GITHUB_SHA:0:7}"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        if: github.ref_type != 'tag' || steps.rel.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: containers
          file: containers/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/preinpost/pi-finances
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # main 푸시 + 새 VERSION → git 태그 vX.Y.Z + GitHub Release 자동 생성
      # (gh release create가 태그를 함께 생성 → 태그 푸시 재트리거는 위 릴리스 존재 체크로 스킵)
      - name: Tag & Release (자동 버전 릴리스)
        if: github.ref_type == 'branch' && steps.newver.outputs.isnew == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ steps.ver.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release create "${VERSION}" --target "${GITHUB_SHA}" --generate-notes
          BODY=$(gh release view "${VERSION}" --json body -q .body)
          gh release edit "${VERSION}" --notes "$(cat <<EOF
          ${BODY}

          ---
          ### Docker 이미지 (컴포넌트 릴리스 자동 버전)
          - \`ghcr.io/preinpost/pi-finance:${VERSION#v}\` (\`latest\`)
          - digest: \`${DIGEST}\`
          EOF
          )"
          echo "Released ${VERSION}"

      # 수동 v* 태그 푸시 시 GitHub Release 생성 (기존 수동 경로)
      - name: Create GitHub Release (수동 v* 태그)
        if: github.ref_type == 'tag' && steps.rel.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release create "${VERSION}" --generate-notes
          BODY=$(gh release view "${VERSION}" --json body -q .body)
          # heredoc(따옴표 없음) — ${VERSION#v}/${DIGEST}는 확장, \` 는 리터럴 백틱
          gh release edit "${VERSION}" --notes "$(cat <<EOF
          ${BODY}

          ---
          ### Docker 이미지
          - \`ghcr.io/preinpost/pi-finance:${VERSION#v}\` (\`latest\`)
          - digest: \`${DIGEST}\`
          EOF
          )"
          echo "Released ${VERSION}"
