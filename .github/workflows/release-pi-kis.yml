# Release pi-kis — 패키지별 bump & publish
#
# packages/pi-kis/** 변경 시 (또는 수동 dispatch) 해당 패키지만:
#   typecheck → (스모크) → 버전 범프(커밋 메시지 기반) → 태그 pi-kis@V → npm publish → GitHub Release
#
# GitHub Actions는 루트 .github/workflows/만 로드하므로 "패키지별 CI"는
# 파일별로 분리해 구성한다. 병렬 실행 안전:
#   - 버전 범프는 패키지 자체 package.json만 수정 (pnpm-lock.yaml 불변 —
#     워크스페이스 의존은 link: 으로 기록되어 버전 미포함)
#   - push 전 git pull --rebase 로 동시 릴리스 직렬화
#
# 첫 릴리스 규칙: 패키지 태그(pi-kis@*)가 없으면 package.json 버전을 그대로
# publish (범프 없음). dispatch로 bump를 명시하면 우선 적용.
#
# 준비: GitHub Secrets에 NPM_TOKEN (publish 권한). provenance 필요 시
#   publish에 --provenance 추가 + job permissions에 id-token: write.

name: Release pi-kis

on:
  push:
    branches: [main]
    paths:
      - 'packages/pi-kis/**'
  workflow_dispatch:
    inputs:
      bump:
        description: '버전 타입 (auto = 커밋 메시지 기반 자동 감지)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-pi-kis
  cancel-in-progress: false

jobs:
  release:
    name: Bump & Publish pi-kis
    runs-on: ubuntu-latest
    # 버전 범프 커밋("[skip ci]")에 의한 재트리거 방지
    if: "!contains(github.event.head_commit.message || '', '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 패키지 태그 이후 커밋 메시지를 읽기 위해 전체 히스토리 필요

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # 버전은 루트 package.json의 packageManager 참조

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter pi-kis typecheck

      - name: Extension smoke test
        run: pnpm --filter pi-kis exec node --experimental-transform-types scripts/smoke.mjs
      - name: Determine bump type
        id: bump
        env:
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          PKG=pi-kis
          DIR=packages/pi-kis
          if [ "$BUMP_INPUT" != "auto" ] && [ -n "$BUMP_INPUT" ]; then
            BUMP="$BUMP_INPUT"
          else
            LAST_TAG=$(git tag -l "${PKG}@*" --sort=-version:refname | head -1 || true)
            if [ -z "$LAST_TAG" ]; then
              # 첫 릴리스 — package.json 버전 그대로 publish
              echo "first=1" >> "$GITHUB_OUTPUT"
              echo "version=$(node -p "require('./$DIR/package.json').version")" >> "$GITHUB_OUTPUT"
              echo "첫 릴리스 — 현재 버전 그대로 publish"
              exit 0
            fi
            COMMITS=$(git log "$LAST_TAG"..HEAD --format=%s -- "$DIR" 2>/dev/null)
            if echo "$COMMITS" | grep -qiE 'BREAKING CHANGE|!:|major'; then
              BUMP=major
            elif echo "$COMMITS" | grep -qiE '^feat|^feature|minor'; then
              BUMP=minor
            else
              BUMP=patch
            fi
          fi
          pnpm --filter "$PKG" exec npm version "$BUMP" --no-git-tag-version --force
          VERSION=$(node -p "require('./$DIR/package.json').version")
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected: pi-kis $BUMP → $VERSION"

      # 버전 커밋만 push (태그는 publish 성공 후) — 실패 시 고아 태그 방지
      - name: Commit & push version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/pi-kis/package.json
          git diff --cached --quiet || git commit -m "chore(release): pi-kis@${VERSION} [skip ci]"
          # 동시 릴리스(타 패키지) 직렬화 — push 레이스 재시도
          # (병렬 워크플로가 push 사이에 커밋할 수 있어 non-fast-forward 거부 시 재시도)
          for i in 1 2 3; do
            git pull --rebase origin main --autostash || exit 1
            if git push origin HEAD:main; then break; fi
            if [ "$i" -lt 3 ]; then sleep 8; fi
          done
          echo "Committed pi-kis@${VERSION}"

      - name: Publish to npm
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm publish -r --filter pi-kis --no-git-checks --access public
          echo "Published pi-kis@${VERSION}"

      - name: Tag & GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git tag "pi-kis@${VERSION}"
          git push origin --tags
          gh release create "pi-kis@${VERSION}" --generate-notes
          echo "Released pi-kis@${VERSION}"

      # 컴포넌트 릴리스 → 컨테이너 이미지 버전 자동 patch+1 (containers/VERSION).
      # 이 커밋이 main에 푸시되면 release-pi-finance-container.yml이 버전 빌드·푸시+릴리스.
      # 병렬 릴리스(타 패키지) 직렬화: fetch 후 reset으로 항상 최신 상태에서 재계산.
      - name: Bump container version
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            if [ -f containers/VERSION ]; then
              IFS=. read -r MAJ MIN PATCH < containers/VERSION
              NEW="${MAJ}.${MIN}.$((PATCH + 1))"
            else
              NEW="1.0.0"
            fi
            echo "$NEW" > containers/VERSION
            git add containers/VERSION
            git commit -m "chore(container): v${NEW}" || true
            if git push origin HEAD:main; then
              echo "컨테이너 버전 → v${NEW}"
              exit 0
            fi
            sleep 8
          done
          echo "컨테이너 버전 범프 푸시 실패 (5회 재시도)" >&2
          exit 1
