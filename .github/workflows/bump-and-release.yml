# Bump & Release
#
# main 브랜치에 push/merge 되면 커밋 메시지를 보고 버전을 자동으로 올리고
# (feat → minor, fix → patch, BREAKING/MAJOR → major), 태그 + GitHub Release를 만들고
# npm에 publish 합니다.
#
# 준비사항 (1회):
#   - GitHub Secrets 에 `NPM_TOKEN` 추가 (npmjs.org access token, publish 권한)
#   - npm provenance를 쓰려면 package.json에 `repository`가 필요(이미 설정됨)하고
#     아래 publish 명령에 `--provenance` 추가 + job permissions에 `id-token: write` 필요
#
# 수동 릴리스: Actions 탭 → "Bump & Release" → Run workflow → 버전 타입 선택
#   (auto = 커밋 메시지 기반 자동 감지 / patch / minor / major)

name: Bump & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: '버전 타입 (auto = 커밋 메시지 기반 자동 감지)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write # 버전 커밋/태그 push + GitHub Release 생성

concurrency:
  group: bump-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-release:
    name: Bump & Publish to npm
    runs-on: ubuntu-latest
    # 버전 범프 커밋("[skip ci]")에 의한 재트리거 방지 (GitHub 네이티브 스킵과 이중 방어)
    if: "!contains(github.event.head_commit.message || '', '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 버전 범프 액션이 이전 태그 사이 커밋 메시지를 읽기 위해 전체 히스토리 필요

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        # 버전 범프 액션의 커밋이 실패하지 않도록 안전장치 (checkout이 이미 설정하지만 명시)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Automated Version Bump
        id: bump
        uses: phips28/gh-action-bump-version@v11
        with:
          tag-prefix: 'v'
          minor-wording: 'feat,minor,feature'
          major-wording: 'MAJOR,breaking,BREAKING CHANGE'
          patch-wording: 'fix,fixes,patch,bug,perf,refactor,chore,docs,style,ci,test'
          rc-wording: 'RELEASE,alpha,beta,rc,pre'
          # workflow_dispatch에서 명시한 버전 타입 (auto면 빈 값 → 커밋 메시지 기반 감지)
          # package.json + package-lock.json을 함께 갱신해 커밋·태그·push까지 수행
          version-type: ${{ inputs.bump == 'auto' && '' || inputs.bump }}
          # [skip ci]로 이 워크플로우가 버전 커밋에 다시 실행되는 것을 방지
          commit-message: 'chore(release): bump version to {{version}} [skip ci]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
