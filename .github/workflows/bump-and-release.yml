# Bump & Release
#
# main 브랜치에 push/merge 되면 커밋 메시지를 보고 버전을 자동으로 올리고
# (feat → minor, fix → patch, BREAKING/! → major), 태그 + GitHub Release를 만들고
# npm에 publish 합니다. 외부 버전 범프 액션 의존 없이 자체 구현.
#
# 준비사항 (1회):
#   - GitHub Secrets 에 `NPM_TOKEN` 추가 (npmjs.org access token, publish 권한)
#   - npm provenance를 쓰려면 package.json에 `repository`가 필요(이미 설정됨)하고
#     아래 publish 명령에 `--provenance` 추가 + job permissions에 `id-token: write` 필요
#
# 수동 릴리스: Actions 탭 → "Bump & Release" → Run workflow → 버전 타입 선택
#   (auto = 커밋 메시지 기반 자동 감지 / patch / minor / major)

name: Bump & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: '버전 타입 (auto = 커밋 메시지 기반 자동 감지)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write # 버전 커밋/태그 push + GitHub Release 생성

concurrency:
  group: bump-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-release:
    name: Bump & Publish to npm
    runs-on: ubuntu-latest
    # 버전 범프 커밋("[skip ci]")에 의한 재트리거 방지 (GitHub 네이티브 스킵과 이중 방어)
    if: "!contains(github.event.head_commit.message || '', '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 마지막 태그 이후 커밋 메시지를 읽기 위해 전체 히스토리 필요

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Determine bump type
        id: bump-type
        env:
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          # workflow_dispatch로 명시한 버전 타입이 있으면 그대로 사용
          if [ "$BUMP_INPUT" != "auto" ] && [ -n "$BUMP_INPUT" ]; then
            BUMP="$BUMP_INPUT"
          else
            # 마지막 태그 이후 커밋 메시지로 판단 (태그가 없으면 전체 커밋 기준)
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then
              COMMITS=$(git log "$LAST_TAG"..HEAD --format=%s 2>/dev/null)
            else
              COMMITS=$(git log --format=%s 2>/dev/null)
            fi
            if echo "$COMMITS" | grep -qiE 'BREAKING CHANGE|!:|major'; then
              BUMP=major
            elif echo "$COMMITS" | grep -qiE '^feat|^feature|minor'; then
              BUMP=minor
            else
              BUMP=patch
            fi
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Detected bump type: $BUMP"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit & tag
        run: |
          npm version "${{ steps.bump-type.outputs.bump }}" --git-tag-version=false --force
          VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push origin HEAD:main --tags
          echo "Tagged v${VERSION}"

      - name: Read package version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
